# TEST ONLY -- never deployed. Included by run_offline_tests.py into a
# temporary copy of the config; it must never sit at the repo root
# (cb1-autopipette seeds every root *.cfg onto machines).
#
# Batch mode has no real endstops, so these helpers set "homed" state
# directly. They go through the real MANUAL_STEPPER wrapper with
# _PLATE_INTERNAL=1, exactly like HOME_PLATE does.

[force_move]
enable_force_move: True     # needed only for SET_KINEMATIC_POSITION in tests

[gcode_macro _T_HOME_PLATE]
gcode:
  {% set p = params.PLATE %}
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  MANUAL_STEPPER STEPPER={p} GCODE_AXIS= _PLATE_INTERNAL=1
  MANUAL_STEPPER STEPPER={p} ENABLE=1 _PLATE_INTERNAL=1
  MANUAL_STEPPER STEPPER={p} SET_POSITION={params.POS|default(0)} _PLATE_INTERNAL=1
  MANUAL_STEPPER STEPPER={p} GCODE_AXIS={c.axes[p]} LIMIT_VELOCITY={c.limit_velocity} LIMIT_ACCEL={c.limit_accel} _PLATE_INTERNAL=1
  SET_GCODE_VARIABLE MACRO=_PLATE_STATE VARIABLE={p} VALUE=1

[gcode_macro _T_HOME_ALL_PLATES]
gcode:
  {% for p in printer["gcode_macro _PLATE_CFG"].axes %}
    _T_HOME_PLATE PLATE={p}
  {% endfor %}

# One line the runner parses: axis map, positions, plunger flag,
# homed gantry axes, number of plates flagged homed.
[gcode_macro _T_STATE]
gcode:
  {% set gm = printer.gcode_move %}
  {% set ps = printer["gcode_macro _PLATE_STATE"] %}
  {% set ns = namespace(n=0) %}
  {% for p in printer["gcode_macro _PLATE_CFG"].axes %}{% if ps[p] %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
  {action_respond_info("STATE axis_map=" ~ gm.axis_map ~ " pos=" ~ gm.position ~ " pip_homed=" ~ printer["gcode_macro _PIPETTE_STATE"].homed ~ " homed=" ~ printer.toolhead.homed_axes ~ " plates=" ~ ns.n ~ " abs=" ~ gm.absolute_coordinates)}

# Every registered G-code command, for the command-inventory check (C-45).
[gcode_macro _T_CMDS]
gcode:
  {action_respond_info("CMDS " ~ (printer.gcode.commands.keys()|sort|join(" ")))}

# Replace one plate's tip-safe list: PLATE=plate1 STOPS=0,120,350 (STOPS=
# empty removes the plate from the list).
[gcode_macro _T_SAFE_STOPS]
gcode:
  {% set d = {} %}
  {% set _ = d.update(printer["gcode_macro _PLATE_CFG"].safe_stops) %}
  {% set stops = params.STOPS|default("") %}
  {% if stops %}
    {% set _ = d.update({params.PLATE: stops.split(",")|map("float")|list}) %}
  {% else %}
    {% set _ = d.pop(params.PLATE) %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PLATE_CFG VARIABLE=safe_stops VALUE="{d}"

# STATE line: is every plate's tip-safe list exactly [0, position_max]?
[gcode_macro _T_SAFE_DEFAULT]
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set ns = namespace(ok=True) %}
  {% for p in c.axes %}
    {% set pmax = printer.configfile.settings['manual_stepper ' ~ p].position_max %}
    {% if c.safe_stops[p]|default([]) != [0, pmax] %}{% set ns.ok = False %}{% endif %}
  {% endfor %}
  {action_respond_info("STATE safe_default=" ~ ns.ok)}
