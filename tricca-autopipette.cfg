# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

# See docs/Config_Reference.md for a description of parameters.
#
# NOTE: [mcu]/serial is intentionally NOT defined here. It's a USB serial ID
# unique to each physical board, so baking one machine's ID into this shared
# file breaks every other machine's Klipper<->MCU connection at startup
# ("mcu 'mcu': Unable to connect"). cb1-autopipette's bootstrap.sh detects the
# board's actual serial ID and writes an [mcu] section into printer.cfg
# itself (machine-owned) instead.
#
# AutoPipette axis expansion (CFG-1): this M8P stays a USB MCU and keeps the
# gantry, the pipette stepper and the tip-eject servo (the EBB42 toolboard is
# deferred). The six plate drawers are on a second USB MCU, [mcu octopus], in
# octopus-plates.cfg; plate-macros.cfg binds the plunger to G-code axis P and
# holds the collision interlock. bootstrap.sh writes [mcu octopus] the same
# way as [mcu]. Keep [force_move] disabled and never add [gcode_arcs]: both
# would move axes past the interlock.

# [homing_override] (axis-expansion plan, WP2 / CFG-1):
# Bare G28: Z, X, Y (existing order), park, all plates, then the plunger.
# G28 <letters>: only what is named. X/Y/Z keep the Z, X, Y order and the park,
# which moves only the axes that are homed afterwards; U V W A B C home single
# plates (Z homed and raised first); P homes the plunger. Unknown letters
# (G28 E, or G28 XY without a space) are refused instead of running a full home.
[homing_override]
axes: xyzuvwabcp
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set gantry = [] %}
  {% for a in "ZXY" %}{% if a in params %}{% set _ = gantry.append(a) %}{% endif %}{% endfor %}
  {% set plates = [] %}
  {% for p, ax in c.axes.items() %}{% if ax in params %}{% set _ = plates.append(p) %}{% endif %}{% endfor %}
  {% set pipette = 'P' in params %}
  # "G" is the command's own letter (G28), which Klipper passes as a parameter.
  {% set known = ["G", "X", "Y", "Z", "P"] + c.axes.values()|list %}
  {% set unknown = params.keys()|reject("in", known)|list %}
  {% if unknown %}
    # e.g. G28 E, or G28 XY (no space: Klipper reads XY as one word). Without
    # this, they would fall through to a full home, plates and plunger included.
    {action_raise_error("G28 refused: unknown axis " ~ unknown|join(", ") ~ " (use letters X Y Z " ~ c.axes.values()|join(" ") ~ " P, separated by spaces)")}
  {% endif %}
  {% if not gantry and not plates and not pipette %}
    G28 Z
    G28 X
    G28 Y
    G1 X150 Y150 Z0 F6000
    HOME_PLATES
    HOME_PIPETTE
  {% else %}
    {% for a in gantry %}
      G28 {a}
    {% endfor %}
    {% if gantry %}
      {% set homed = printer.toolhead.homed_axes ~ (gantry|join|lower) %}
      {% set park = [] %}
      {% if 'x' in homed %}{% set _ = park.append("X150") %}{% endif %}
      {% if 'y' in homed %}{% set _ = park.append("Y150") %}{% endif %}
      {% if 'z' in homed %}{% set _ = park.append("Z0") %}{% endif %}
      G1 {park|join(" ")} F6000
    {% endif %}
    {% for p in plates %}
      HOME_PLATE PLATE={p}
    {% endfor %}
    {% if pipette %}
      HOME_PIPETTE
    {% endif %}
  {% endif %}

# Motor1
[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 2
rotation_distance: 40
endstop_pin: ^PF4
position_endstop: 0
position_max: 340
homing_speed: 100
homing_retract_dist: 0

## Motor1
[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 0
driver_SGTHRS: 127

# Motor2#5998cb
[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 2
rotation_distance: 40
endstop_pin: ^PF3
position_endstop: 0
position_max: 358
homing_speed: 100
homing_retract_dist: 0

## Motor2
[tmc2209 stepper_y]
uart_pin: PE3
run_current: 0.800
stealthchop_threshold: 0

#  Z0 Stepper - front left on Motor4
[stepper_z]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PF2
position_endstop: 0
position_max: 200
position_min: -5.0
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

## Motor4
[tmc2209 stepper_z]
uart_pin: PB5
run_current: 0.650
stealthchop_threshold: 0

##	Z1 Stepper - Front Right on Motor5
[stepper_z1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
endstop_pin: ^!PF1
microsteps: 16
rotation_distance: 8

## Motor5
[tmc2209 stepper_z1]
uart_pin: PG14
run_current: 0.650
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on Motor6
[stepper_z2]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
endstop_pin: ^!PF0
microsteps: 16
rotation_distance: 8

## Motor6
[tmc2209 stepper_z2]
uart_pin: PG10
run_current: 0.650
stealthchop_threshold: 0

##	Z3 Stepper - Rear Left on Motor7
[stepper_z3]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
endstop_pin: ^!PC15
microsteps: 16
rotation_distance: 8

## Motor7
[tmc2209 stepper_z3]
uart_pin: PD5
run_current: 0.650
stealthchop_threshold: 0

[manual_stepper pipette_stepper]
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
endstop_pin: ^!PB10
microsteps: 16
# NEMA-17 driving a single-start T8 lead screw: 2 mm lead, so 1 Klipper-mm
# equals 1 mm of plunger travel. Was 8 (the T8x8 4-start value), which made
# every syringe MOVE/SPEED/ACCEL tapd sent 4x physical mm. Must deploy in
# lockstep with Tricca_AutoPipette's matching 0.25x rescale (issue #29).
# rotation_distance = lead = pitch (2 mm for T8) x number of starts:
#   single-start T8 (T8x2): 2   <- this build
#   four-start T8 (T8x8):   8   (if the screw is ever swapped, tapd's
#   syringe calibration_mm/speeds/accels must scale x4 to match)
rotation_distance: 2

[tmc2209 manual_stepper pipette_stepper]
uart_pin: PC6
interpolate: false
run_current: 0.650
stealthchop_threshold: 0

[servo pipette_servo]
pin: PE9
maximum_servo_angle: 180
minimum_pulse_width: 0.0005  # 0.5 ms
maximum_pulse_width: 0.0025  # 2.5 ms

[force_move]
enable_force_move: False
#   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION
#   extended G-Code commands. The default is false.

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 300
max_z_accel: 3000

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>
