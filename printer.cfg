[include mainsail.cfg]

# host MCU service is preinstalled and ready to use with:
[mcu CB1]
serial: /tmp/klipper_host_mcu

[include tricca-autopipette.cfg]

[idle_timeout]
timeout: 7200
gcode:
  RESPOND TYPE=command MSG="Idle timeout hit — not disabling steppers"
  # Intentionally NOT calling TURN_OFF_HEATERS or M84

# --- Pause in place (no park / no hop / no retract) ---
[gcode_macro PAUSE]
description: Pause in place (remove Mainsail park)
rename_existing: PAUSE_ORIG
gcode:
  {% set p = printer.gcode_move.gcode_position %}
  # Call original PAUSE but tell it to "park" exactly where we are
  PAUSE_ORIG X={p.x} Y={p.y} Z_MIN={p.z}
  RESPOND TYPE=echo MSG="Paused in place (no park)."

[gcode_macro _CLIENT_VARIABLE]
variable_retract: 0.0            # no retract on pause
variable_custom_park_dz: 0.0     # kill the default +2 mm hop
gcode:
